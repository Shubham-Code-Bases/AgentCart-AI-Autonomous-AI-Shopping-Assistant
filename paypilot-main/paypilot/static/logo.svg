<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" width="200" height="44" fill="none">
  <defs>
    <linearGradient id="acGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="aiBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4f46e5" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g filter="url(#shadow)">
    <rect x="2" y="4" width="36" height="36" rx="9" fill="url(#acGrad)"/>
    <!-- Cart basket -->
    <path d="M10 13h3.2l2.8 11.2a1.2 1.2 0 0 0 1.2.9h11.2a1.2 1.2 0 0 0 1.2-.9l2.4-8.2H14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wheels -->
    <circle cx="18" cy="29" r="1.6" fill="#ffffff"/>
    <circle cx="27" cy="29" r="1.6" fill="#ffffff"/>
    <!-- AI Sparkle -->
    <path d="M25 8.5c0 1.8 1.4 2.5 1.4 2.5s-1.4.7-1.4 2.5c0-1.8-1.4-2.5-1.4-2.5s1.4-.7 1.4-2.5z" fill="#fde047"/>
    <circle cx="29.5" cy="14" r="0.9" fill="#a5f3fc"/>
  </g>

  <!-- Brand Typography -->
  <text x="48" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">AgentCart</text>
  
  <!-- AI Badge -->
  <rect x="156" y="11" width="32" height="20" rx="6" fill="url(#aiBadge)"/>
  <text x="172" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">AI</text>
</svg>

